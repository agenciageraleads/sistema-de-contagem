version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-contagem_ciclica}
      POSTGRES_USER: ${DB_USER:-contagem_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - portaleletricos
    deploy:
      placement:
        constraints:
          - node.role == manager

  backend:
    image: ghcr.io/agenciageraleads/sistema-de-contagem/backend:latest
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      SANKHYA_API_URL: ${SANKHYA_API_URL}
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_TOKEN: ${SANKHYA_TOKEN}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SPOKE_API_KEY: ${SPOKE_API_KEY}
    depends_on:
      - db
    networks:
      - portaleletricos
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=1
        - traefik.http.routers.contagem-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
        - traefik.http.routers.contagem-api.entrypoints=websecure
        - traefik.http.routers.contagem-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.contagem-api.priority=2
        - traefik.http.routers.contagem-api.middlewares=contagem-sec-headers@docker
        - traefik.http.services.contagem-api.loadbalancer.server.port=3001
        - traefik.http.middlewares.contagem-sec-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.contagem-sec-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.contagem-sec-headers.headers.stsPreload=true
        - traefik.http.middlewares.contagem-sec-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.contagem-sec-headers.headers.browserXssFilter=true
        - traefik.http.middlewares.contagem-sec-headers.headers.frameDeny=true
        - traefik.http.middlewares.contagem-sec-headers.headers.referrerPolicy=no-referrer

  frontend:
    image: ghcr.io/agenciageraleads/sistema-de-contagem/frontend:latest
    environment:
      API_URL: https://${APP_DOMAIN}/api
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
    networks:
      - portaleletricos
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=1
        - traefik.http.routers.contagem-web.rule=Host(`${APP_DOMAIN}`)
        - traefik.http.routers.contagem-web.entrypoints=websecure
        - traefik.http.routers.contagem-web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.contagem-web.priority=1
        - traefik.http.routers.contagem-web.middlewares=contagem-sec-headers@docker
        - traefik.http.services.contagem-web.loadbalancer.server.port=3000

networks:
  portaleletricos:
    external: true
    name: portaleletricos

volumes:
  pgdata_prod:
    driver: local
